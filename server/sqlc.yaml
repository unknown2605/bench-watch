version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    strict_function_checks: true
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_pointers_for_null_types: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_copyfrom_file_name: copyfrom.gen.go
        output_files_suffix: .gen
        overrides:
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
